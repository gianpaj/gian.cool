<template><link rel="stylesheet" href="assets/film.css"><style>#captions{position:absolute;inset:0;font-family:Film,sans-serif;pointer-events:none}</style><div id="captions" data-composition-id="captions" data-width="1920" data-height="1080"><p id="caption-001" class="clip caption" data-start="0.290" data-duration="2.870" data-track-index="1" data-layout-allow-caption-zone>Why is a wind-turbine maker building</p><p id="caption-002" class="clip caption" data-start="3.160" data-duration="1.260" data-track-index="1" data-layout-allow-caption-zone>an AI data centre?</p><p id="caption-003" class="clip caption" data-start="4.650" data-duration="2.630" data-track-index="1" data-layout-allow-caption-zone>In Inner Mongolia, Envision is connecting</p><p id="caption-004" class="clip caption" data-start="7.280" data-duration="1.760" data-track-index="1" data-layout-allow-caption-zone>those businesses through an AI campus</p><p id="caption-005" class="clip caption" data-start="9.550" data-duration="1.130" data-track-index="1" data-layout-allow-caption-zone>called Galaxy.</p><p id="caption-006" class="clip caption" data-start="10.890" data-duration="2.420" data-track-index="1" data-layout-allow-caption-zone>Follow the electricity to understand why</p><p id="caption-007" class="clip caption" data-start="13.310" data-duration="2.200" data-track-index="1" data-layout-allow-caption-zone>an energy company wants to build</p><p id="caption-008" class="clip caption" data-start="15.510" data-duration="0.370" data-track-index="1" data-layout-allow-caption-zone>it.</p><p id="caption-009" class="clip caption" data-start="16.000" data-duration="2.800" data-track-index="1" data-layout-allow-caption-zone>Envision founder and CEO Lei Zhang</p><p id="caption-010" class="clip caption" data-start="18.800" data-duration="2.720" data-track-index="1" data-layout-allow-caption-zone>started the company in 2007, making</p><p id="caption-011" class="clip caption" data-start="21.520" data-duration="0.930" data-track-index="1" data-layout-allow-caption-zone>wind turbines.</p><p id="caption-012" class="clip caption" data-start="22.450" data-duration="2.440" data-track-index="1" data-layout-allow-caption-zone>It expanded into batteries and energy</p><p id="caption-013" class="clip caption" data-start="24.910" data-duration="0.890" data-track-index="1" data-layout-allow-caption-zone>systems.</p><p id="caption-014" class="clip caption" data-start="26.010" data-duration="2.760" data-track-index="1" data-layout-allow-caption-zone>Computing creates demand for that equipment.</p><p id="caption-015" class="clip caption" data-start="28.770" data-duration="3.050" data-track-index="1" data-layout-allow-caption-zone>Ulanqab sits about 300 kilometres northwest</p><p id="caption-016" class="clip caption" data-start="31.820" data-duration="2.620" data-track-index="1" data-layout-allow-caption-zone>of Beijing, in China&#x27;s Inner Mongolia.</p><p id="caption-017" class="clip caption" data-start="34.640" data-duration="3.000" data-track-index="1" data-layout-allow-caption-zone>SemiAnalysis visited in September 2026.</p><p id="caption-018" class="clip caption" data-start="37.640" data-duration="1.830" data-track-index="1" data-layout-allow-caption-zone>Its report is the starting point</p><p id="caption-019" class="clip caption" data-start="39.470" data-duration="1.160" data-track-index="1" data-layout-allow-caption-zone>for this story.</p><p id="caption-020" class="clip caption" data-start="40.850" data-duration="3.510" data-track-index="1" data-layout-allow-caption-zone>OpenAI&#x27;s Stargate is the American comparison.</p><p id="caption-021" class="clip caption" data-start="44.570" data-duration="2.590" data-track-index="1" data-layout-allow-caption-zone>Galaxy is a separate Envision project.</p><p id="caption-022" class="clip caption" data-start="47.370" data-duration="3.240" data-track-index="1" data-layout-allow-caption-zone>SemiAnalysis reports 120 megawatts delivered in</p><p id="caption-023" class="clip caption" data-start="50.610" data-duration="1.590" data-track-index="1" data-layout-allow-caption-zone>August, within a year.</p><p id="caption-024" class="clip caption" data-start="52.400" data-duration="2.170" data-track-index="1" data-layout-allow-caption-zone>Here, IT capacity means power intended</p><p id="caption-025" class="clip caption" data-start="54.590" data-duration="2.810" data-track-index="1" data-layout-allow-caption-zone>for servers and other computing equipment.</p><p id="caption-026" class="clip caption" data-start="57.400" data-duration="1.860" data-track-index="1" data-layout-allow-caption-zone>The report puts the full campus</p><p id="caption-027" class="clip caption" data-start="59.260" data-duration="2.000" data-track-index="1" data-layout-allow-caption-zone>plan at 800 megawatts of IT</p><p id="caption-028" class="clip caption" data-start="61.260" data-duration="0.910" data-track-index="1" data-layout-allow-caption-zone>capacity.</p><p id="caption-029" class="clip caption" data-start="62.170" data-duration="1.620" data-track-index="1" data-layout-allow-caption-zone>A delivered phase and a future</p><p id="caption-030" class="clip caption" data-start="63.790" data-duration="1.910" data-track-index="1" data-layout-allow-caption-zone>plan are different milestones.</p><p id="caption-031" class="clip caption" data-start="65.700" data-duration="1.700" data-track-index="1" data-layout-allow-caption-zone>That distinction matters.</p><p id="caption-032" class="clip caption" data-start="67.610" data-duration="1.800" data-track-index="1" data-layout-allow-caption-zone>Capacity alone cannot tell us how</p><p id="caption-033" class="clip caption" data-start="69.410" data-duration="2.200" data-track-index="1" data-layout-allow-caption-zone>much useful AI computing is actually</p><p id="caption-034" class="clip caption" data-start="71.610" data-duration="1.230" data-track-index="1" data-layout-allow-caption-zone>taking place.</p><p id="caption-035" class="clip caption" data-start="73.090" data-duration="2.530" data-track-index="1" data-layout-allow-caption-zone>Accelerators process data, with memory and</p><p id="caption-036" class="clip caption" data-start="75.620" data-duration="2.020" data-track-index="1" data-layout-allow-caption-zone>networks keeping them supplied.</p><p id="caption-037" class="clip caption" data-start="77.850" data-duration="2.350" data-track-index="1" data-layout-allow-caption-zone>Power must reach those racks reliably.</p><p id="caption-038" class="clip caption" data-start="80.410" data-duration="1.260" data-track-index="1" data-layout-allow-caption-zone>Their heat also has to leave</p><p id="caption-039" class="clip caption" data-start="81.670" data-duration="1.090" data-track-index="1" data-layout-allow-caption-zone>the building.</p><p id="caption-040" class="clip caption" data-start="82.940" data-duration="2.810" data-track-index="1" data-layout-allow-caption-zone>SemiAnalysis describes a five-megawatt pilot testing</p><p id="caption-041" class="clip caption" data-start="85.750" data-duration="1.840" data-track-index="1" data-layout-allow-caption-zone>a different way of supplying the</p><p id="caption-042" class="clip caption" data-start="87.590" data-duration="0.610" data-track-index="1" data-layout-allow-caption-zone>racks.</p><p id="caption-043" class="clip caption" data-start="88.450" data-duration="3.550" data-track-index="1" data-layout-allow-caption-zone>Solid-state transformers convert incoming alternating current</p><p id="caption-044" class="clip caption" data-start="92.000" data-duration="2.890" data-track-index="1" data-layout-allow-caption-zone>into an 800-volt direct-current bus.</p><p id="caption-045" class="clip caption" data-start="94.890" data-duration="1.910" data-track-index="1" data-layout-allow-caption-zone>At the same power, doubling DC</p><p id="caption-046" class="clip caption" data-start="96.800" data-duration="1.880" data-track-index="1" data-layout-allow-caption-zone>voltage halves the current in a</p><p id="caption-047" class="clip caption" data-start="98.680" data-duration="0.930" data-track-index="1" data-layout-allow-caption-zone>conductor.</p><p id="caption-048" class="clip caption" data-start="99.610" data-duration="2.180" data-track-index="1" data-layout-allow-caption-zone>At the same resistance, lower current</p><p id="caption-049" class="clip caption" data-start="101.790" data-duration="1.620" data-track-index="1" data-layout-allow-caption-zone>reduces heating losses.</p><p id="caption-050" class="clip caption" data-start="103.650" data-duration="2.430" data-track-index="1" data-layout-allow-caption-zone>Galaxy&#x27;s actual savings need measuring.</p><p id="caption-051" class="clip caption" data-start="106.080" data-duration="2.510" data-track-index="1" data-layout-allow-caption-zone>Rack electronics still reduce voltage further</p><p id="caption-052" class="clip caption" data-start="108.590" data-duration="2.140" data-track-index="1" data-layout-allow-caption-zone>before that power reaches the chips.</p><p id="caption-053" class="clip caption" data-start="110.730" data-duration="2.990" data-track-index="1" data-layout-allow-caption-zone>Envision also makes turbines and batteries,</p><p id="caption-054" class="clip caption" data-start="113.720" data-duration="1.960" data-track-index="1" data-layout-allow-caption-zone>extending its role beyond owning the</p><p id="caption-055" class="clip caption" data-start="115.680" data-duration="0.720" data-track-index="1" data-layout-allow-caption-zone>building.</p><p id="caption-056" class="clip caption" data-start="116.400" data-duration="2.720" data-track-index="1" data-layout-allow-caption-zone>The company can coordinate generation, storage</p><p id="caption-057" class="clip caption" data-start="119.120" data-duration="2.250" data-track-index="1" data-layout-allow-caption-zone>and equipment supplying power inside the</p><p id="caption-058" class="clip caption" data-start="121.370" data-duration="0.630" data-track-index="1" data-layout-allow-caption-zone>campus.</p><p id="caption-059" class="clip caption" data-start="122.000" data-duration="1.920" data-track-index="1" data-layout-allow-caption-zone>But a wind farm&#x27;s rated power</p><p id="caption-060" class="clip caption" data-start="123.920" data-duration="1.670" data-track-index="1" data-layout-allow-caption-zone>is not its output at every</p><p id="caption-061" class="clip caption" data-start="125.590" data-duration="0.810" data-track-index="1" data-layout-allow-caption-zone>moment.</p><p id="caption-062" class="clip caption" data-start="126.690" data-duration="2.160" data-track-index="1" data-layout-allow-caption-zone>The wind rises and falls.</p><p id="caption-063" class="clip caption" data-start="129.090" data-duration="2.680" data-track-index="1" data-layout-allow-caption-zone>Computing equipment needs reliable power through</p><p id="caption-064" class="clip caption" data-start="131.770" data-duration="1.040" data-track-index="1" data-layout-allow-caption-zone>those changes.</p><p id="caption-065" class="clip caption" data-start="132.810" data-duration="2.960" data-track-index="1" data-layout-allow-caption-zone>Batteries store some surplus electricity and</p><p id="caption-066" class="clip caption" data-start="135.770" data-duration="2.530" data-track-index="1" data-layout-allow-caption-zone>supply it when generation falls below</p><p id="caption-067" class="clip caption" data-start="138.300" data-duration="0.820" data-track-index="1" data-layout-allow-caption-zone>demand.</p><p id="caption-068" class="clip caption" data-start="139.330" data-duration="3.040" data-track-index="1" data-layout-allow-caption-zone>Their usefulness depends on power, stored</p><p id="caption-069" class="clip caption" data-start="142.370" data-duration="2.070" data-track-index="1" data-layout-allow-caption-zone>energy, and how long the calm</p><p id="caption-070" class="clip caption" data-start="144.440" data-duration="0.840" data-track-index="1" data-layout-allow-caption-zone>lasts.</p><p id="caption-071" class="clip caption" data-start="145.490" data-duration="2.490" data-track-index="1" data-layout-allow-caption-zone>&#x27;Wind-powered&#x27; does not establish that wind</p><p id="caption-072" class="clip caption" data-start="147.980" data-duration="2.980" data-track-index="1" data-layout-allow-caption-zone>supplies all the electricity, every hour.</p><p id="caption-073" class="clip caption" data-start="150.960" data-duration="1.860" data-track-index="1" data-layout-allow-caption-zone>How much of Galaxy is fitted</p><p id="caption-074" class="clip caption" data-start="152.820" data-duration="2.540" data-track-index="1" data-layout-allow-caption-zone>with hardware and actually running remains</p><p id="caption-075" class="clip caption" data-start="155.870" data-duration="1.010" data-track-index="1" data-layout-allow-caption-zone>unverified.</p><p id="caption-076" class="clip caption" data-start="157.250" data-duration="2.180" data-track-index="1" data-layout-allow-caption-zone>Reported delivered capacity is not a</p><p id="caption-077" class="clip caption" data-start="159.430" data-duration="2.440" data-track-index="1" data-layout-allow-caption-zone>measurement of load drawn by working</p><p id="caption-078" class="clip caption" data-start="161.870" data-duration="0.930" data-track-index="1" data-layout-allow-caption-zone>servers.</p><p id="caption-079" class="clip caption" data-start="163.010" data-duration="2.900" data-track-index="1" data-layout-allow-caption-zone>Buildings and megawatts cannot confirm installed</p><p id="caption-080" class="clip caption" data-start="165.910" data-duration="1.940" data-track-index="1" data-layout-allow-caption-zone>chips, or how much work they</p><p id="caption-081" class="clip caption" data-start="167.850" data-duration="0.790" data-track-index="1" data-layout-allow-caption-zone>produce.</p><p id="caption-082" class="clip caption" data-start="168.810" data-duration="3.270" data-track-index="1" data-layout-allow-caption-zone>Envision&#x27;s larger capacity announcements also need</p><p id="caption-083" class="clip caption" data-start="172.080" data-duration="3.170" data-track-index="1" data-layout-allow-caption-zone>reconciling with SemiAnalysis&#x27;s description of the</p><p id="caption-084" class="clip caption" data-start="175.270" data-duration="0.810" data-track-index="1" data-layout-allow-caption-zone>campus.</p><p id="caption-085" class="clip caption" data-start="176.290" data-duration="1.570" data-track-index="1" data-layout-allow-caption-zone>Those are questions for Zhang and</p><p id="caption-086" class="clip caption" data-start="177.860" data-duration="2.560" data-track-index="1" data-layout-allow-caption-zone>the site&#x27;s engineers, alongside the wider</p><p id="caption-087" class="clip caption" data-start="180.910" data-duration="0.610" data-track-index="1" data-layout-allow-caption-zone>strategy.</p><p id="caption-088" class="clip caption" data-start="181.520" data-duration="1.430" data-track-index="1" data-layout-allow-caption-zone>The next test is how much</p><p id="caption-089" class="clip caption" data-start="183.040" data-duration="2.610" data-track-index="1" data-layout-allow-caption-zone>useful computing this energy system can</p><p id="caption-090" class="clip caption" data-start="185.650" data-duration="0.670" data-track-index="1" data-layout-allow-caption-zone>deliver.</p></div><script>const tl=gsap.timeline({paused:true});tl.set({},{},188.000);window.__timelines=window.__timelines||{};window.__timelines.captions=tl;</script></template>
