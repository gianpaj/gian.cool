<template><link rel="stylesheet" href="assets/film.css"><style>#captions{position:absolute;inset:0;font-family:Film,sans-serif;pointer-events:none}</style><div id="captions" data-composition-id="captions" data-width="1920" data-height="1080"><p id="caption-001" class="clip caption" data-start="0.190" data-duration="2.970" data-track-index="1" data-layout-allow-caption-zone>Why is a wind-turbine maker building</p><p id="caption-002" class="clip caption" data-start="3.160" data-duration="1.920" data-track-index="1" data-layout-allow-caption-zone>an AI data centre?</p><p id="caption-003" class="clip caption" data-start="5.180" data-duration="2.620" data-track-index="1" data-layout-allow-caption-zone>In Inner Mongolia, Envision is connecting</p><p id="caption-004" class="clip caption" data-start="7.800" data-duration="2.000" data-track-index="1" data-layout-allow-caption-zone>those businesses through an AI campus</p><p id="caption-005" class="clip caption" data-start="9.800" data-duration="1.280" data-track-index="1" data-layout-allow-caption-zone>called Galaxy.</p><p id="caption-006" class="clip caption" data-start="11.190" data-duration="2.510" data-track-index="1" data-layout-allow-caption-zone>Follow the electricity to understand why</p><p id="caption-007" class="clip caption" data-start="13.700" data-duration="2.080" data-track-index="1" data-layout-allow-caption-zone>an energy company wants to build</p><p id="caption-008" class="clip caption" data-start="15.780" data-duration="0.300" data-track-index="1" data-layout-allow-caption-zone>it.</p><p id="caption-009" class="clip caption" data-start="16.180" data-duration="2.370" data-track-index="1" data-layout-allow-caption-zone>Envision founder and CEO Lei Zhang</p><p id="caption-010" class="clip caption" data-start="18.550" data-duration="3.280" data-track-index="1" data-layout-allow-caption-zone>started the company in 2007, making</p><p id="caption-011" class="clip caption" data-start="21.830" data-duration="1.170" data-track-index="1" data-layout-allow-caption-zone>wind turbines.</p><p id="caption-012" class="clip caption" data-start="23.000" data-duration="2.260" data-track-index="1" data-layout-allow-caption-zone>It expanded into batteries and energy</p><p id="caption-013" class="clip caption" data-start="25.260" data-duration="0.820" data-track-index="1" data-layout-allow-caption-zone>systems.</p><p id="caption-014" class="clip caption" data-start="26.190" data-duration="2.890" data-track-index="1" data-layout-allow-caption-zone>Computing creates demand for that equipment.</p><p id="caption-015" class="clip caption" data-start="29.080" data-duration="2.960" data-track-index="1" data-layout-allow-caption-zone>Ulanqab sits about 300 kilometres northwest</p><p id="caption-016" class="clip caption" data-start="32.040" data-duration="3.040" data-track-index="1" data-layout-allow-caption-zone>of Beijing, in China&#x27;s Inner Mongolia.</p><p id="caption-017" class="clip caption" data-start="35.190" data-duration="3.830" data-track-index="1" data-layout-allow-caption-zone>SemiAnalysis visited in September 2026.</p><p id="caption-018" class="clip caption" data-start="39.020" data-duration="1.310" data-track-index="1" data-layout-allow-caption-zone>Its report is the starting point</p><p id="caption-019" class="clip caption" data-start="40.330" data-duration="0.750" data-track-index="1" data-layout-allow-caption-zone>for this story.</p><p id="caption-020" class="clip caption" data-start="41.190" data-duration="3.820" data-track-index="1" data-layout-allow-caption-zone>OpenAI&#x27;s Stargate is the American comparison.</p><p id="caption-021" class="clip caption" data-start="45.010" data-duration="3.070" data-track-index="1" data-layout-allow-caption-zone>Galaxy is a separate Envision project.</p><p id="caption-022" class="clip caption" data-start="48.190" data-duration="3.090" data-track-index="1" data-layout-allow-caption-zone>SemiAnalysis reports 120 megawatts delivered in</p><p id="caption-023" class="clip caption" data-start="51.280" data-duration="2.800" data-track-index="1" data-layout-allow-caption-zone>August 2026, within a year.</p><p id="caption-024" class="clip caption" data-start="54.190" data-duration="2.890" data-track-index="1" data-layout-allow-caption-zone>That&#x27;s power for computing equipment.</p><p id="caption-025" class="clip caption" data-start="57.190" data-duration="2.700" data-track-index="1" data-layout-allow-caption-zone>Megawatts measure the rate of electricity</p><p id="caption-026" class="clip caption" data-start="59.990" data-duration="2.090" data-track-index="1" data-layout-allow-caption-zone>use, not AI performance.</p><p id="caption-027" class="clip caption" data-start="62.190" data-duration="2.890" data-track-index="1" data-layout-allow-caption-zone>The full plan is 800 megawatts.</p><p id="caption-028" class="clip caption" data-start="65.190" data-duration="2.360" data-track-index="1" data-layout-allow-caption-zone>Used continuously, that matches the annual</p><p id="caption-029" class="clip caption" data-start="67.550" data-duration="3.810" data-track-index="1" data-layout-allow-caption-zone>grid electricity bought by about 650,000</p><p id="caption-030" class="clip caption" data-start="71.360" data-duration="0.640" data-track-index="1" data-layout-allow-caption-zone>US homes.</p><p id="caption-031" class="clip caption" data-start="72.000" data-duration="2.890" data-track-index="1" data-layout-allow-caption-zone>Or about 67 stadiums like Munich&#x27;s</p><p id="caption-032" class="clip caption" data-start="74.990" data-duration="3.540" data-track-index="1" data-layout-allow-caption-zone>Allianz Arena, comparing their maximum available</p><p id="caption-033" class="clip caption" data-start="78.840" data-duration="1.240" data-track-index="1" data-layout-allow-caption-zone>electrical power.</p><p id="caption-034" class="clip caption" data-start="80.190" data-duration="2.310" data-track-index="1" data-layout-allow-caption-zone>For AI, imagine eight centres using</p><p id="caption-035" class="clip caption" data-start="82.500" data-duration="2.580" data-track-index="1" data-layout-allow-caption-zone>100 megawatts for computing each.</p><p id="caption-036" class="clip caption" data-start="85.190" data-duration="1.810" data-track-index="1" data-layout-allow-caption-zone>Cooling needs extra power.</p><p id="caption-037" class="clip caption" data-start="87.000" data-duration="3.080" data-track-index="1" data-layout-allow-caption-zone>These are comparisons, not measured usage.</p><p id="caption-038" class="clip caption" data-start="90.190" data-duration="3.120" data-track-index="1" data-layout-allow-caption-zone>Accelerators process data, with memory and</p><p id="caption-039" class="clip caption" data-start="93.310" data-duration="2.770" data-track-index="1" data-layout-allow-caption-zone>networks keeping them supplied.</p><p id="caption-040" class="clip caption" data-start="96.190" data-duration="1.810" data-track-index="1" data-layout-allow-caption-zone>Power must reach those racks reliably.</p><p id="caption-041" class="clip caption" data-start="98.000" data-duration="1.850" data-track-index="1" data-layout-allow-caption-zone>Their heat also has to leave</p><p id="caption-042" class="clip caption" data-start="99.850" data-duration="1.230" data-track-index="1" data-layout-allow-caption-zone>the building.</p><p id="caption-043" class="clip caption" data-start="101.190" data-duration="2.970" data-track-index="1" data-layout-allow-caption-zone>SemiAnalysis describes a five-megawatt pilot testing</p><p id="caption-044" class="clip caption" data-start="104.160" data-duration="2.170" data-track-index="1" data-layout-allow-caption-zone>a different way of supplying the</p><p id="caption-045" class="clip caption" data-start="106.330" data-duration="0.750" data-track-index="1" data-layout-allow-caption-zone>racks.</p><p id="caption-046" class="clip caption" data-start="107.190" data-duration="3.900" data-track-index="1" data-layout-allow-caption-zone>Solid-state transformers convert incoming alternating current</p><p id="caption-047" class="clip caption" data-start="111.090" data-duration="2.910" data-track-index="1" data-layout-allow-caption-zone>into an 800-volt direct-current bus.</p><p id="caption-048" class="clip caption" data-start="114.000" data-duration="2.000" data-track-index="1" data-layout-allow-caption-zone>At the same power, doubling DC</p><p id="caption-049" class="clip caption" data-start="116.000" data-duration="1.980" data-track-index="1" data-layout-allow-caption-zone>voltage halves the current in a</p><p id="caption-050" class="clip caption" data-start="117.980" data-duration="1.020" data-track-index="1" data-layout-allow-caption-zone>conductor.</p><p id="caption-051" class="clip caption" data-start="119.000" data-duration="2.330" data-track-index="1" data-layout-allow-caption-zone>At the same resistance, lower current</p><p id="caption-052" class="clip caption" data-start="121.330" data-duration="1.730" data-track-index="1" data-layout-allow-caption-zone>reduces heating losses.</p><p id="caption-053" class="clip caption" data-start="123.190" data-duration="2.890" data-track-index="1" data-layout-allow-caption-zone>Galaxy&#x27;s actual savings need measuring.</p><p id="caption-054" class="clip caption" data-start="126.190" data-duration="2.580" data-track-index="1" data-layout-allow-caption-zone>Rack electronics still reduce voltage further</p><p id="caption-055" class="clip caption" data-start="128.770" data-duration="2.310" data-track-index="1" data-layout-allow-caption-zone>before that power reaches the chips.</p><p id="caption-056" class="clip caption" data-start="131.140" data-duration="2.750" data-track-index="1" data-layout-allow-caption-zone>Envision also makes turbines and batteries,</p><p id="caption-057" class="clip caption" data-start="133.990" data-duration="2.200" data-track-index="1" data-layout-allow-caption-zone>extending its role beyond owning the</p><p id="caption-058" class="clip caption" data-start="136.330" data-duration="0.750" data-track-index="1" data-layout-allow-caption-zone>building.</p><p id="caption-059" class="clip caption" data-start="137.190" data-duration="3.190" data-track-index="1" data-layout-allow-caption-zone>The company can coordinate generation, storage</p><p id="caption-060" class="clip caption" data-start="140.380" data-duration="2.820" data-track-index="1" data-layout-allow-caption-zone>and equipment supplying power inside the</p><p id="caption-061" class="clip caption" data-start="143.200" data-duration="0.880" data-track-index="1" data-layout-allow-caption-zone>campus.</p><p id="caption-062" class="clip caption" data-start="144.190" data-duration="1.560" data-track-index="1" data-layout-allow-caption-zone>But a wind farm&#x27;s rated power</p><p id="caption-063" class="clip caption" data-start="145.750" data-duration="1.530" data-track-index="1" data-layout-allow-caption-zone>is not its output at every</p><p id="caption-064" class="clip caption" data-start="147.280" data-duration="0.780" data-track-index="1" data-layout-allow-caption-zone>moment.</p><p id="caption-065" class="clip caption" data-start="148.190" data-duration="1.810" data-track-index="1" data-layout-allow-caption-zone>The wind rises and falls.</p><p id="caption-066" class="clip caption" data-start="150.000" data-duration="2.930" data-track-index="1" data-layout-allow-caption-zone>Computing equipment needs reliable power through</p><p id="caption-067" class="clip caption" data-start="152.930" data-duration="1.140" data-track-index="1" data-layout-allow-caption-zone>those changes.</p><p id="caption-068" class="clip caption" data-start="154.070" data-duration="2.820" data-track-index="1" data-layout-allow-caption-zone>Batteries store some surplus electricity and</p><p id="caption-069" class="clip caption" data-start="156.990" data-duration="2.340" data-track-index="1" data-layout-allow-caption-zone>supply it when generation falls below</p><p id="caption-070" class="clip caption" data-start="159.330" data-duration="0.750" data-track-index="1" data-layout-allow-caption-zone>demand.</p><p id="caption-071" class="clip caption" data-start="160.190" data-duration="3.040" data-track-index="1" data-layout-allow-caption-zone>Their usefulness depends on power, stored</p><p id="caption-072" class="clip caption" data-start="163.230" data-duration="2.100" data-track-index="1" data-layout-allow-caption-zone>energy, and how long the calm</p><p id="caption-073" class="clip caption" data-start="165.330" data-duration="0.750" data-track-index="1" data-layout-allow-caption-zone>lasts.</p><p id="caption-074" class="clip caption" data-start="166.190" data-duration="2.250" data-track-index="1" data-layout-allow-caption-zone>&#x27;Wind-powered&#x27; does not establish that wind</p><p id="caption-075" class="clip caption" data-start="168.440" data-duration="2.640" data-track-index="1" data-layout-allow-caption-zone>supplies all the electricity, every hour.</p><p id="caption-076" class="clip caption" data-start="171.180" data-duration="1.370" data-track-index="1" data-layout-allow-caption-zone>How much of Galaxy is fitted</p><p id="caption-077" class="clip caption" data-start="172.550" data-duration="2.490" data-track-index="1" data-layout-allow-caption-zone>with hardware and actually running remains</p><p id="caption-078" class="clip caption" data-start="175.040" data-duration="1.040" data-track-index="1" data-layout-allow-caption-zone>unverified.</p><p id="caption-079" class="clip caption" data-start="176.190" data-duration="2.360" data-track-index="1" data-layout-allow-caption-zone>Reported delivered capacity is not a</p><p id="caption-080" class="clip caption" data-start="178.550" data-duration="2.620" data-track-index="1" data-layout-allow-caption-zone>measurement of load drawn by working</p><p id="caption-081" class="clip caption" data-start="181.330" data-duration="0.750" data-track-index="1" data-layout-allow-caption-zone>servers.</p><p id="caption-082" class="clip caption" data-start="182.190" data-duration="2.440" data-track-index="1" data-layout-allow-caption-zone>Buildings and megawatts cannot confirm installed</p><p id="caption-083" class="clip caption" data-start="184.630" data-duration="1.570" data-track-index="1" data-layout-allow-caption-zone>chips, or how much work they</p><p id="caption-084" class="clip caption" data-start="186.200" data-duration="0.880" data-track-index="1" data-layout-allow-caption-zone>produce.</p><p id="caption-085" class="clip caption" data-start="187.140" data-duration="3.030" data-track-index="1" data-layout-allow-caption-zone>Envision&#x27;s larger capacity announcements also need</p><p id="caption-086" class="clip caption" data-start="190.170" data-duration="3.090" data-track-index="1" data-layout-allow-caption-zone>reconciling with SemiAnalysis&#x27;s description of the</p><p id="caption-087" class="clip caption" data-start="193.260" data-duration="0.820" data-track-index="1" data-layout-allow-caption-zone>campus.</p><p id="caption-088" class="clip caption" data-start="194.190" data-duration="1.580" data-track-index="1" data-layout-allow-caption-zone>Those are questions for Zhang and</p><p id="caption-089" class="clip caption" data-start="195.770" data-duration="2.420" data-track-index="1" data-layout-allow-caption-zone>the site&#x27;s engineers, alongside the wider</p><p id="caption-090" class="clip caption" data-start="198.190" data-duration="0.890" data-track-index="1" data-layout-allow-caption-zone>strategy.</p><p id="caption-091" class="clip caption" data-start="199.190" data-duration="1.350" data-track-index="1" data-layout-allow-caption-zone>The next test is how much</p><p id="caption-092" class="clip caption" data-start="200.540" data-duration="2.610" data-track-index="1" data-layout-allow-caption-zone>useful computing this energy system can</p><p id="caption-093" class="clip caption" data-start="203.150" data-duration="0.170" data-track-index="1" data-layout-allow-caption-zone>deliver.</p></div><script>const tl=gsap.timeline({paused:true});tl.set({},{},205.000);window.__timelines=window.__timelines||{};window.__timelines.captions=tl;</script></template>
