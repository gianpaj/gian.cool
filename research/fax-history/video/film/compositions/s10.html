    (function () {
      const tl = gsap.timeline({ paused: true });

      // 0-0.4 s: colour flood paper -> ink while the strip collapses into a row of bits.
      tl.fromTo("#s10-ground", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 0);
      tl.fromTo("#s10-strip", { scaleY: 1, transformOrigin: "50% 50%" }, { scaleY: 0.03, transformOrigin: "50% 50%", duration: 0.38, ease: "power3.in" }, 0);
      tl.fromTo("#s10-strip", { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "none" }, 0.32);
      // The bits print out left to right behind an accent edge, at constant speed.
      tl.fromTo("#s10-row-in", { clipPath: "inset(0px 100% 0px 0px)" }, { clipPath: "inset(0px 0% 0px 0px)", duration: 3.0, ease: "none" }, 0.35);
      tl.fromTo("#s10-row-edge", { x: 0 }, { x: 1469, duration: 3.0, ease: "none" }, 0.35);
      tl.fromTo("#s10-row-edge", { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "power3.in", immediateRender: false }, 3.4);

      // 0.6 s: per-word blur in.
      tl.fromTo("#s10-today .s10-word", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power4.out" }, 0.6);
      tl.fromTo(["#s10-today .s10-word", "#s10-row-in"], { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.2, stagger: 0.02, ease: "power3.in", immediateRender: false }, 5.8);

      // 6.1-13.8 s: the diagram grows left to right, each part wiping in as the line names it.
      const wipe = function (sel, at, dur) {
        tl.fromTo(sel, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: dur || 0.5, ease: "power2.out" }, at);
      };
      wipe("#s10-faxA", 6.1);
      wipe("#s10-tones", 6.8, 0.6);
      wipe("#s10-gwA", 7.4);
      tl.fromTo("#s10-bits", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "none" }, 8.4);
      wipe("#s10-gwB-in", 12.7);
      wipe("#s10-wire", 13.3, 0.2);
      wipe("#s10-faxB", 13.4);

      // Packets cross at constant speed (one crossing of the 400 px lane per 2 s), each spare copy
      // 0.25 s behind its original. The wrap re-enters a packet on the left once it has slid fully out.
      const PKT_W = 88;
      const SPEED = (400 + PKT_W) / 2;
      const wrapX = gsap.utils.unitize(gsap.utils.wrap(-PKT_W, 400));
      const runTo = 25.6;
      const cross = function (sel, at) {
        const dur = runTo - at;
        tl.fromTo(sel, { x: -PKT_W }, { x: -PKT_W + SPEED * dur, duration: dur, ease: "none", modifiers: { x: wrapX } }, at);
      };
      [1, 2, 3].forEach(function (n, k) {
        cross("#s10-p" + n, 11.2 + k * 0.6667);
        cross("#s10-c" + n, 11.45 + k * 0.6667);
      });

      // Lines: per word from dim to paper.
      tl.fromTo("#s10-cap1 .s10-word", { opacity: 0.12 }, { opacity: 1, duration: 0.25, stagger: 0.08, ease: "power2.out" }, 6.4);
      tl.fromTo("#s10-cap2 .s10-word", { opacity: 0.12 }, { opacity: 1, duration: 0.25, stagger: 0.08, ease: "power2.out" }, 11.0);
      tl.fromTo(["#s10-cap1 .s10-word", "#s10-cap2 .s10-word"], { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.2, stagger: 0.015, ease: "power3.in", immediateRender: false }, 17.45);

      // 18.0 s: the payoff, per-word blur in; "inside" in accent.

      // 25.3 s: everything leaves; the ink ground is left for s11's flood.

      tl.fromTo("#s10-diagram-in", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power3.in" }, 25.35);
