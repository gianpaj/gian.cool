      // The 33 bits from s06 (001000 010 001000 10 0101000 010 110100), one cell each.
      const BITS = "001000010001000100101000010110100";
      const CELL = 1536 / BITS.length;
      const bitsEl = document.getElementById("s07-bits");
      for (let i = 0; i < BITS.length; i++) {
        const s = document.createElement("span");
        s.className = "s07-bit";
        s.textContent = BITS[i];
        bitsEl.appendChild(s);
      }
      // A tone per bit: one cycle for a 0, two for a 1, phase kept continuous across cells.
      let d = "";
      let phase = 0;
      for (let x = 0; x <= 1536; x += 1) {
        const bit = BITS[Math.min(BITS.length - 1, Math.floor(x / CELL))];
        if (x > 0) phase += (2 * Math.PI * (bit === "1" ? 2 : 1)) / CELL;
        d += (x ? "L" : "M") + x + " " + (100 - 64 * Math.sin(phase)).toFixed(1);
      }
      document.getElementById("s07-wave-path").setAttribute("d", d);

      const tl = gsap.timeline({ paused: true });
      const OUT = { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in", immediateRender: false };
      const IN0 = { opacity: 1, filter: "blur(0px)" };
      const SWEEP = 3.6;

      // 0-7.8 s: the bits arrive, then turn into sound under the playhead (modem sound from 2.0 s).
      tl.fromTo(".s07-bit", { opacity: 0 }, { opacity: 1, duration: 0.12, stagger: 0.03, ease: "power2.out" }, 0.1);
      tl.fromTo("#s07-t1-in", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 0.7);
      tl.fromTo("#s07-play", { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, 2.0);
      tl.fromTo("#s07-play", { x: 0 }, { x: 1533, duration: SWEEP, ease: "none" }, 2.0);
      tl.fromTo("#s07-wavedraw", { clipPath: "inset(0px 100% 0px 0px)" }, { clipPath: "inset(0px 0% 0px 0px)", duration: SWEEP, ease: "none" }, 2.0);
      tl.fromTo(".s07-bit", { opacity: 1 }, { opacity: 0.3, duration: 0.15, stagger: SWEEP / BITS.length, ease: "power2.out", immediateRender: false }, 2.0 + SWEEP / BITS.length);
      tl.fromTo("#s07-play", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power3.in", immediateRender: false }, 2.0 + SWEEP);
      tl.fromTo(["#s07-t1-in", "#s07-wavedraw"], IN0, { ...OUT, stagger: 0.04 }, 7.5);
      tl.fromTo(".s07-bit", { opacity: 0.3, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.2, stagger: 0.004, ease: "power3.in", immediateRender: false }, 7.55);

      // 8.2-17.9 s: the end-of-line code takes over the pendulums' job.
      tl.fromTo("#s07-t2 .s07-word", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power4.out" }, 8.2);

      tl.fromTo("#s07-pend-in", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 10.5);
      tl.fromTo("#s07-pa", { rotation: -14, transformOrigin: "22px 0px" }, { rotation: 14, transformOrigin: "22px 0px", duration: 0.8, repeat: 3, yoyo: true, ease: "sine.inOut" }, 10.5);
      tl.fromTo("#s07-pb", { rotation: -10, transformOrigin: "22px 0px" }, { rotation: 16, transformOrigin: "22px 0px", duration: 0.88, repeat: 3, yoyo: true, ease: "sine.inOut" }, 10.5);
      tl.fromTo("#s07-pend-in", IN0, { ...OUT, duration: 0.3 }, 13.2);
      tl.fromTo("#s07-t3 .s07-word", { opacity: 0.12 }, { opacity: 1, duration: 0.25, stagger: 0.09, ease: "power2.out" }, 13.7);
      tl.fromTo(["#s07-t2 .s07-word", ".s07-c", "#s07-t3 .s07-word"], IN0, { ...OUT, stagger: 0.008 }, 17.3);

      // 18-23.5 s: the minifax prints behind the scan line, at fax pace.

      tl.fromTo("#s07-print", { clipPath: "inset(0px 0px 100% 0px)" }, { clipPath: "inset(0px 0px 0% 0px)", duration: 5.5, ease: "none" }, 18.0);
      tl.fromTo("#s07-scan", { y: 0 }, { y: 725, duration: 5.5, ease: "none" }, 18.0);
      tl.fromTo("#s07-scan", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power3.in", immediateRender: false }, 23.5);

      tl.fromTo("#s07-t4 .s07-word", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power4.out" }, 18.4);
