      const EXAMPLE = "WWWWWWWWWWWWBWWWWWWWWWWWWBBBWWWWWWWWWWWWWWWWWWWWWWWWBWWWWWWWWWWWWWW";
      const BLACK_RUNS = [
        12, 1, 25, 3, 52, 1, 272, 16, 292, 4, 304, 4, 312, 8, 324, 4, 344, 8, 356, 4, 364, 8, 392, 84, 484, 4, 492, 8,
        504, 4, 512, 52, 568, 16, 620, 36, 688, 44, 756, 24, 784, 4, 848, 48, 900, 36, 992, 4, 1000, 4, 1008, 4, 1016,
        16, 1036, 4, 1068, 4, 1076, 4, 1112, 28, 1168, 4, 1176, 16, 1196, 24, 1224, 12, 1240, 36, 1280, 4, 1296, 24,
        1336, 4, 1344, 20, 1384, 24, 1436, 4, 1444, 4,
      ];
      let d = "";
      for (let i = 0; i < BLACK_RUNS.length; i += 2) d += "M" + BLACK_RUNS[i] + " 0h" + BLACK_RUNS[i + 1] + "v22h-" + BLACK_RUNS[i + 1] + "z";
      document.getElementById("s06-dots").setAttribute("d", d);

      const NS = "http://www.w3.org/2000/svg";
      const grid = document.getElementById("s06-grid");
      for (let i = 0; i < EXAMPLE.length; i++) {
        const r = document.createElementNS(NS, "rect");
        const black = EXAMPLE[i] === "B";
        r.setAttribute("x", 22 * i + 1);
        r.setAttribute("y", 1);
        r.setAttribute("width", 20);
        r.setAttribute("height", 20);
        r.setAttribute("fill", black ? "#141414" : "#efefec");
        r.setAttribute("stroke", black ? "none" : "rgba(20,20,20,0.5)");
        r.setAttribute("stroke-width", 1.5);
        grid.appendChild(r);
      }

      const fmt = (v) => {
        const n = Math.round(v);
        return n >= 1000 ? Math.floor(n / 1000) + "," + String(n % 1000).padStart(3, "0") : String(n);
      };
      const nEl = document.getElementById("s06-n");
      const n67 = document.getElementById("s06-n67");
      const n33 = document.getElementById("s06-n33");

      const tl = gsap.timeline({ paused: true });
      const OUT = { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in", immediateRender: false };
      const IN0 = { opacity: 1, filter: "blur(0px)" };

      // 0-1.45 s: zoom through into one row of dots (row 124 lands on y 600), then the view narrows to it.

      // 1.4-5.9 s: the standard.

      tl.fromTo("#s06-t1 .s06-word", IN0, { ...OUT, stagger: 0.03 }, 5.6);
      tl.fromTo("#s06-q1-in", IN0, OUT, 5.65);

      // 6.0 s: the row closes into one line of 1,728 dots.
      tl.fromTo("#s06-view", { clipPath: "inset(585px 0px 465px 0px)" }, { clipPath: "inset(600px 0px 480px 0px)", duration: 0.3, ease: "power3.in", immediateRender: false }, 5.9);
      tl.fromTo("#s06-frame", { clipPath: "inset(0px 100% 0px 0px)" }, { clipPath: "inset(0px 0% 0px 0px)", duration: 0.6, ease: "power4.out" }, 6.0);

      // 6.4-9.4 s: the playhead reads the line at constant speed while the count runs.
      tl.fromTo("#s06-play", { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, 6.4);
      tl.fromTo("#s06-play", { x: 0 }, { x: 1725, duration: 3.0, ease: "none" }, 6.4);
      tl.fromTo("#s06-fill", { clipPath: "inset(0px 100% 0px 0px)" }, { clipPath: "inset(0px 0% 0px 0px)", duration: 3.0, ease: "none" }, 6.4);
      const c1728 = { v: 0 };
      tl.fromTo(c1728, { v: 0 }, { v: 1728, duration: 3.0, ease: "none", onUpdate: () => (nEl.textContent = fmt(c1728.v)) }, 6.4);
      tl.fromTo("#s06-play", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power3.in", immediateRender: false }, 9.4);
      tl.fromTo("#s06-t2 .s06-word", { opacity: 0 }, { opacity: 1, duration: 0.25, stagger: 0.08, ease: "power2.out" }, 9.45);
      tl.fromTo(["#s06-n", "#s06-t2 .s06-word"], IN0, { ...OUT, stagger: 0.03 }, 11.7);

      // 12-13 s: the first 67 dots grow to 22 px squares.
      tl.fromTo("#s06-frame", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power3.in" }, 12.0);
      tl.fromTo("#s06-zoom", { scaleX: 1, x: 0, transformOrigin: "0px 11px" }, { scaleX: 22, x: 96, transformOrigin: "0px 11px", duration: 1.0, ease: "power2.inOut" }, 12.0);
      tl.fromTo("#s06-grid", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 12.85);

      // 13.3-15.8 s: runs, bracketed and named one at a time.
      tl.fromTo("#s06-runs .s06-brk", { opacity: 0, scaleX: 0.3 }, { opacity: 1, scaleX: 1, duration: 0.5, stagger: 0.35, ease: "power4.out" }, 13.3);
      tl.fromTo("#s06-runs .s06-lab", { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.35, ease: "power2.out" }, 13.4);
      tl.fromTo("#s06-t3-in", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 13.8);

      tl.fromTo("#s06-codes .s06-code", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.35, ease: "power4.out" }, 16.4);

      tl.fromTo(c67, { a: 0, b: 0 }, { a: 67, b: 33, duration: 1.5, ease: "power2.out", onUpdate: () => ((n67.textContent = fmt(c67.a)), (n33.textContent = fmt(c67.b))) }, 19.9);

      tl.fromTo(["#s06-grid", "#s06-runs .s06-brk", "#s06-runs .s06-lab", "#s06-codes .s06-code"], IN0, OUT, 24.1);
      tl.fromTo(["#s06-t3-in", "#s06-count-in"], IN0, { ...OUT, stagger: 0.05 }, 24.1);

      // 25-35 s: a blank line.
      tl.fromTo("#s06-bframe", { clipPath: "inset(0px 100% 0px 0px)" }, { clipPath: "inset(0px 0% 0px 0px)", duration: 0.7, ease: "power4.out" }, 25.1);
      tl.fromTo("#s06-t4 .s06-word", { opacity: 0.12 }, { opacity: 1, duration: 0.25, stagger: 0.09, ease: "power2.out" }, 25.5);
      tl.fromTo(["#s06-b1", "#s06-b2", "#s06-b3"], { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 1.0, ease: "power4.out" }, 26.6);
      tl.fromTo(["#s06-g1-brk", "#s06-g1-lab"], { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 27.75);
      tl.fromTo(["#s06-g2-brk", "#s06-g2-lab"], { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 28.75);
      tl.fromTo("#s06-q4-in", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 31.3);
