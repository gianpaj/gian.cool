  <script>
    (function () {
      // The analog signal: a rounded on/off level plus a deterministic sum of sines as line noise.
      const W = 720;
      const EDGES = [110, 200, 300, 340, 470, 590, 640];
      const MID = 150;
      const UNIT = 75;
      const level = (x) =>
        EDGES.reduce((b, t, k) => b + (k % 2 === 0 ? -2 : 2) * (0.5 + 0.5 * Math.tanh((x - t) / 3)), 1);
      const noise = (x) =>
        0.17 * Math.sin(0.19 * x + 0.4) +
        0.12 * Math.sin(0.43 * x + 1.9) +
        0.08 * Math.sin(0.97 * x + 0.7) +
        0.05 * Math.sin(2.11 * x + 2.3);
      const signal = (x) => level(x) + noise(x);

      let wave = "";
      for (let x = 0; x <= W; x += 2) wave += (x ? "L" : "M") + x + " " + (MID - signal(x) * UNIT).toFixed(1);
      document.getElementById("s05-wave-path").setAttribute("d", wave);

      // The decision: threshold the same signal. Above the line is white (high), below is black (low).
      const HI = 20;
      const LO = 120;
      let up = signal(0) > 0;
      let sq = "M0 " + (up ? HI : LO);
      for (let x = 0.5; x <= W; x += 0.5) {
        const now = signal(x) > 0;
        if (now !== up) {
          sq += "L" + x + " " + (up ? HI : LO) + "L" + x + " " + (now ? HI : LO);
          up = now;
        }
      }
      sq += "L" + W + " " + (up ? HI : LO);
      document.getElementById("s05-sq-path").setAttribute("d", sq);

      const tl = gsap.timeline({ paused: true });
      const OUT = { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in", immediateRender: false };
      const IN0 = { opacity: 1, filter: "blur(0px)" };

      // 0-5.8 s: the rule, in two lines.
      tl.fromTo("#s05-t1 .s05-word", { opacity: 0.12 }, { opacity: 1, duration: 0.25, stagger: 0.09, ease: "power2.out" }, 0.3);
      tl.fromTo("#s05-t2-in", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 2.6);
      tl.fromTo("#s05-t1 .s05-word", IN0, { ...OUT, stagger: 0.03 }, 5.45);
      tl.fromTo("#s05-t2-in", IN0, OUT, 5.55);

      // 6-10.1 s: the diagram grows one part at a time.
      tl.fromTo("#s05-wave", { clipPath: "inset(0px 100% 0px 0px)" }, { clipPath: "inset(0px 0% 0px 0px)", duration: 1.4, ease: "power2.inOut" }, 6.0);
      tl.fromTo("#s05-thr", { clipPath: "inset(0px 100% 0px 0px)" }, { clipPath: "inset(0px 0% 0px 0px)", duration: 0.6, ease: "power4.out" }, 7.7);
      // The decision is taken at constant speed: linear sweep, square wave drawn behind the playhead.
      tl.fromTo("#s05-play", { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, 8.6);
      tl.fromTo("#s05-play", { x: 0 }, { x: 717, duration: 1.5, ease: "none" }, 8.6);
      tl.fromTo("#s05-sq", { clipPath: "inset(0px 100% 0px 0px)" }, { clipPath: "inset(0px 0% 0px 0px)", duration: 1.5, ease: "none" }, 8.6);
      tl.fromTo("#s05-play", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power3.in", immediateRender: false }, 10.1);
      tl.fromTo("#s05-lw", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 8.85);
      tl.fromTo("#s05-lb", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 9.05);

      // The quiet line, one phrase per part it names.
      tl.fromTo("#s05-q-a", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 9.2);
      tl.fromTo("#s05-q-b", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 10.4);
      tl.fromTo("#s05-q-c", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 11.6);

      // 13.5-16.5 s: the scan line sweeps down; above it the page is decided, below it still noisy.
      tl.fromTo("#s05-scan", { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, 13.5);
      tl.fromTo("#s05-clean", { clipPath: "inset(0px 0px 100% 0px)" }, { clipPath: "inset(0px 0px 0% 0px)", duration: 3.0, ease: "none" }, 13.5);
      tl.fromTo("#s05-scan", { y: 0 }, { y: 947, duration: 3.0, ease: "none" }, 13.5);
      tl.fromTo("#s05-scan", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power3.in", immediateRender: false }, 16.5);

      // 16-16.3 s: the diagram and its line leave.
      tl.fromTo(["#s05-wave", "#s05-thr", "#s05-sq", "#s05-lw", "#s05-lb"], IN0, OUT, 16.0);
      tl.fromTo(["#s05-q-a", "#s05-q-b", "#s05-q-c"], IN0, { ...OUT, stagger: 0.03 }, 16.0);

      // 17-26.5 s: Bartlane's 1920 page is laid over ours, then lifted off again.
      tl.fromTo("#s05-bartsheet", { x: 940 }, { x: 0, duration: 0.7, ease: "expo.out" }, 17.0);
      tl.fromTo("#s05-bt .s05-word", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power4.out" }, 17.5);
      tl.fromTo("#s05-bq-in", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 21.1);
      tl.fromTo(".s05-swatch", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, stagger: 0.2, ease: "expo.out" }, 22.4);

      tl.fromTo("#s05-bt .s05-word", IN0, { ...OUT, stagger: 0.02 }, 25.85);
      tl.fromTo("#s05-bq-in", IN0, OUT, 25.9);
      tl.fromTo(".s05-swatch", { opacity: 1 }, { opacity: 0, duration: 0.2, stagger: 0.02, ease: "power3.in", immediateRender: false }, 25.9);
      tl.fromTo("#s05-bartsheet", { x: 0 }, { x: 940, duration: 0.42, ease: "power3.in", immediateRender: false }, 26.1);

      // 26.9-28.25 s: the scan line runs down the clean page and stops under one row (row 124 of
      // page-bit, "hommage de G. Caselli"); s06 opens on this frame and dives into that row.
      tl.fromTo("#s05-scan", { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none", immediateRender: false }, 26.9);
      tl.fromTo("#s05-scan", { y: 0 }, { y: 425, duration: 1.35, ease: "none", immediateRender: false }, 26.9);

      window.__timelines["s05"] = tl;
    })();
  </script>
