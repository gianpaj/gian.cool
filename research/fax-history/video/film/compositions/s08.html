  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const PAGE_H = 381;
      const SVG_NS = "http://www.w3.org/2000/svg";

      // Clock ticks: 12 marks, drawn once.
      document.querySelectorAll("#s08-clockL .s08-ticks, #s08-clockR .s08-ticks").forEach(function (g) {
        if (g.childNodes.length) return;
        for (let k = 0; k < 12; k++) {
          const a = (k * Math.PI) / 6;
          const t = document.createElementNS(SVG_NS, "line");
          t.setAttribute("x1", 80 + 62 * Math.sin(a));
          t.setAttribute("y1", 80 - 62 * Math.cos(a));
          t.setAttribute("x2", 80 + 72 * Math.sin(a));
          t.setAttribute("y2", 80 - 72 * Math.cos(a));
          t.setAttribute("stroke-width", k % 3 === 0 ? 4 : 2);
          g.appendChild(t);
        }
      });

      // 0-0.45 s: whip. The minifax smears out left, the two machines smear in from the right.
      tl.fromTo("#s08-mini", { x: -140, filter: "blur(10px)" }, { x: -1900, filter: "blur(18px)", duration: 0.24, ease: "power2.in" }, 0);
      tl.fromTo("#s08-machines-in", { x: 1600, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, 0.04);

      // Left, Group 1: crawls. 36x slower than the right (6 min vs 10 s), so one page takes 72 s here.
      // It starts 23% printed so the first handwritten line is already arriving.
      tl.fromTo("#s08-printL", { clipPath: "inset(0px 0px 77% 0px)" }, { clipPath: "inset(0px 0px 60.5% 0px)", duration: 11.9, ease: "none" }, 0.5);
      tl.fromTo("#s08-scanL", { y: PAGE_H * 0.23 }, { y: PAGE_H * 0.395, duration: 11.9, ease: "none" }, 0.5);
      tl.fromTo("#s08-handL", { rotation: 82.8, svgOrigin: "80 80" }, { rotation: 142.3, svgOrigin: "80 80", duration: 11.9, ease: "none" }, 0.5);

      // Right, Group 3: a whole page in 2 s, five times.
      const again = { duration: 2, ease: "none", repeat: 4, repeatDelay: 0.4 };
      tl.fromTo("#s08-printR", { clipPath: "inset(0px 0px 100% 0px)" }, Object.assign({ clipPath: "inset(0px 0px 0% 0px)" }, again), 0.6);
      tl.fromTo("#s08-scanR", { y: 0 }, Object.assign({ y: PAGE_H - 3 }, again), 0.6);
      tl.fromTo("#s08-handR", { rotation: 0, svgOrigin: "80 80" }, Object.assign({ rotation: 360, svgOrigin: "80 80" }, again), 0.6);

      // Labels: whole-line blur in, then dead still.
      tl.fromTo("#s08-g1-in", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 1.0);
      tl.fromTo("#s08-g3-in", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 3.0);

      // 12.4 s: the machines leave the way they came.
      tl.fromTo("#s08-machines-in", { x: 0 }, { x: -1920, duration: 0.4, ease: "power3.in", immediateRender: false }, 12.4);

      // 13-25 s: the dot field. Dot i appears when 200^p reaches i + 1 (p = 0 in 1970, 1 in 1990):
      // the two endpoints are the data; between them the count grows at a constant rate.
      const grid = document.getElementById("s08-grid");
      if (!grid.childNodes.length) {
        for (let i = 0; i < 200; i++) {
          const d = document.createElement("div");
          d.className = "s08-dot";
          d.style.left = (i % 20) * 58 + "px";
          d.style.top = Math.floor(i / 20) * 58 + "px";
          grid.appendChild(d);
        }
      }
      const year = document.getElementById("s08-year");
      if (!year.childNodes.length) {
        for (let y = 1970; y <= 1990; y++) {
          const s = document.createElement("span");
          s.className = "s08-yr";
          s.textContent = String(y);
          // The years between the two data points flick past as a count; only 1970 and 1990 are read.
          if (y !== 1970 && y !== 1990) s.setAttribute("data-layout-ignore", "");
          year.appendChild(s);
        }
      }
      const dots = grid.querySelectorAll(".s08-dot");
      const years = year.querySelectorAll(".s08-yr");
      const G0 = 16.0;
      const GD = 3.6;
      // Dot n appears in the year the US count reached n x 25,000, interpolated through the
      // three known points: 1 dot (1970), 10 dots (250,000 in 1980), 200 dots (5 million in 1990).
      const yearOfCount = (c) => (c <= 10 ? 10 * Math.log10(c) : 10 + (10 * Math.log(c / 10)) / Math.log(20));

      tl.fromTo(dots[0], { scale: 0 }, { scale: 1, duration: 0.6, ease: "expo.out" }, 13.0);
      for (let i = 1; i < 200; i++) {
        tl.fromTo(dots[i], { scale: 0 }, { scale: 1, duration: 0.3, ease: "expo.out" }, G0 + (GD * yearOfCount(i + 1)) / 20);
      }

      tl.fromTo(years[0], { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 13.0);
      for (let k = 1; k < years.length; k++) {
        const at = G0 + (GD * k) / 20;
        tl.fromTo(years[k - 1], { opacity: 1 }, { opacity: 0, duration: 0.01, ease: "none", immediateRender: false }, at);
        tl.fromTo(years[k], { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, at);
      }

      // Lines: per-word blur in.
      tl.fromTo("#s08-l1 .s08-word", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power4.out" }, 13.1);
      tl.fromTo("#s08-l2 .s08-word", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power4.out" }, 19.8);
      tl.fromTo("#s08-japan-in", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 21.6);

      // Dip cut: darken ~40% for the last 3 frames before the hard cut to s09.
      tl.fromTo("#s08-dip", { opacity: 0 }, { opacity: 0.4, duration: 0.04, ease: "none" }, 24.86);

      window.__timelines["s08"] = tl;
    })();
  </script>
